name: Daily Quant Pipeline

on:
  schedule:
    # Runs at 20:45 UTC (3:45 PM Eastern) Monday through Friday
    - cron: '45 20 * * 1-5'
  workflow_dispatch: # This adds a "Run Now" button on GitHub so we can test it!

# CONCURRENCY LOCK: Prevents simultaneous runs from corrupting the database
concurrency:
  group: "quant-pipeline"
  cancel-in-progress: false

permissions:
  contents: write # Restored to 'write' so the bot can commit the local database

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline
      run: python main.py
      
    - name: Commit and Push Database Update
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        # Force add the database file just in case it was added to .gitignore
        git add -f data/options_pipeline.db
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated database update"
        git push