name: Daily Quant Pipeline

on:
  schedule:
    # Runs at 20:45 UTC (3:45 PM Eastern) Monday through Friday
    - cron: '45 20 * * 1-5'
  workflow_dispatch: # This adds a "Run Now" button on GitHub so we can test it!

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline
      run: python main.py

    - name: Commit and Push Database Update
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/options_pipeline.db
        
        # Only commit if the database actually changed
        git diff --quiet && git diff --staged --quiet || git commit -m "Automated database update"
        git push