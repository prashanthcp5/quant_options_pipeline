name: Daily Quant Pipeline

on:
  schedule:
    # Runs at 20:45 UTC (3:45 PM Eastern) Monday through Friday
    - cron: '45 20 * * 1-5'
  workflow_dispatch: # This adds a "Run Now" button on GitHub so we can test it!

# CONCURRENCY LOCK: Prevents simultaneous runs from corrupting the database
concurrency:
  group: "quant-pipeline"
  cancel-in-progress: false

permissions:
  contents: read # Downgraded from 'write' because we no longer commit to the repo

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install libsql-client # Required to connect to the Turso Cloud Database

    - name: Run Pipeline
      env:
        # Injects your secure cloud database keys into the pipeline
        TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
        TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      run: python main.py
      
    # The database commit step has been permanently removed.